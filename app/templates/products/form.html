{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
            <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
            <a href="/products" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Quay lại
            </a>
        </div>

        <form method="POST" action="{% if product %}/products/{{ product.id }}/edit{% else %}/products/new{% endif %}" enctype="multipart/form-data" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã sản phẩm *</label>
                    <input type="text" name="code" value="{{ product.code if product else '' }}" required {% if product %}readonly class="w-full px-3 py-2 bg-slate-100 border rounded-xl text-xs font-mono text-slate-500"{% else %}placeholder="vd: SP-BA-01" class="w-full px-3 py-2 border rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-amber-500 outline-none"{% endif %}>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tên sản phẩm *</label>
                    <input type="text" name="name" value="{{ product.name if product else '' }}" required placeholder="vd: Bàn ăn gỗ sồi 6 ghế" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Loại gỗ chính</label>
                    <input type="text" name="wood_type" value="{{ product.wood_type if product and product.wood_type else '' }}" placeholder="vd: Gỗ sồi Nga, Gõ đỏ, MDF..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kích thước (D x R x C)</label>
                    <input type="text" name="dimensions" value="{{ product.dimensions if product and product.dimensions else '' }}" placeholder="vd: 1600 x 800 x 750 mm" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Giá bán niêm yết (VNĐ) *</label>
                    <input type="number" step="any" min="0" name="price" value="{{ product.price if product else '0.0' }}" required class="w-full px-3 py-2 border rounded-xl text-xs font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ảnh sản phẩm</label>
                    <input type="file" name="image" accept="image/*" class="w-full px-3 py-1.5 border rounded-xl text-xs file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mô tả sản phẩm</label>
                <textarea name="description" rows="3" placeholder="Đặc điểm thiết kế, loại sơn hoàn thiện, phụ kiện đi kèm..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">{{ product.description if product and product.description else '' }}</textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                <a href="/products" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md">
                    {{ "Lưu Sản Phẩm" if product else "Tạo Sản Phẩm & Cấu Hình BOM" }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
