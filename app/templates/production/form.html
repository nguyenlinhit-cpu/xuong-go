{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
            <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
            <a href="/production" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Quay lại
            </a>
        </div>

        <form method="POST" action="/production/new" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã Lệnh Sản Xuất *</label>
                    <input type="text" name="code" value="{{ code_default }}" required class="w-full px-3 py-2 border rounded-xl text-xs font-mono font-bold text-amber-800 focus:ring-2 focus:ring-amber-500 outline-none uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Đơn hàng liên kết (nếu có)</label>
                    <select name="order_id" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">-- Độc lập (Sản xuất dự trữ kho) --</option>
                        {% for o in orders %}
                        <option value="{{ o.id }}" {% if selected_order_id == o.id %}selected{% endif %}>{{ o.code }} - {{ o.customer.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sản phẩm cần sản xuất *</label>
                    <select name="product_id" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">-- Chọn sản phẩm nội thất --</option>
                        {% for p in products %}
                        <option value="{{ p.id }}" {% if selected_product_id == p.id %}selected{% endif %}>{{ p.code }} - {{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Số lượng *</label>
                    <input type="number" min="1" name="quantity" value="{{ default_quantity }}" required class="w-full px-3 py-2 border rounded-xl text-xs text-center font-bold focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ngày bắt đầu *</label>
                    <input type="date" name="start_date" value="{{ today_str }}" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Hạn hoàn thành</label>
                    <input type="date" name="due_date" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ghi chú kỹ thuật của Quản đốc</label>
                <textarea name="note" rows="3" placeholder="Lưu ý về quy chuẩn gỗ, hướng vân, thời gian sấy lại phôi..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                <a href="/production" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md">
                    <i class="fa-solid fa-check mr-1.5"></i> Tạo Lệnh Sản Xuất
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
