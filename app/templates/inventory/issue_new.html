{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <div>
            <h2 class="text-xl font-bold text-slate-900">{{ title }}</h2>
            <p class="text-xs text-slate-500">Hệ thống sẽ kiểm tra tồn kho và tự động trừ vật tư</p>
        </div>
        <a href="/inventory/issues" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
            <i class="fa-solid fa-arrow-left mr-1.5"></i> Quay lại
        </a>
    </div>

    <form method="POST" action="/inventory/issues/new" class="space-y-6">
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã phiếu xuất *</label>
                <input type="text" name="code" value="{{ code_default }}" required class="w-full px-3 py-2 border rounded-xl text-xs font-mono font-bold text-rose-800 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ngày xuất kho *</label>
                <input type="date" name="date" value="{{ today_str }}" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Lý do xuất *</label>
                <select name="reason" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    <option value="Sản xuất theo yêu cầu">Sản xuất theo yêu cầu</option>
                    <option value="Xuất thử mẫu / R&D">Xuất thử mẫu / R&D</option>
                    <option value="Hao hụt / Hỏng hóc phôi gỗ">Hao hụt / Hỏng hóc phôi gỗ</option>
                    <option value="Bán lẻ nguyên vật liệu">Bán lẻ nguyên vật liệu</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden p-5">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Chi tiết vật tư xuất kho</h3>
                <button type="button" onclick="addRow()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold">
                    <i class="fa-solid fa-plus mr-1"></i> Thêm dòng vật tư
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs" id="items-table">
                    <thead class="bg-slate-50 border-b text-slate-500 font-bold uppercase">
                        <tr>
                            <th class="py-2.5 px-3 min-w-[300px]">Nguyên vật liệu xuất (Hiện có tồn kho)</th>
                            <th class="py-2.5 px-3 w-32 text-center">Số lượng xuất</th>
                            <th class="py-2.5 px-3 w-12 text-center">Xóa</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100" id="table-body">
                        <tr class="item-row">
                            <td class="py-2.5 px-3">
                                <select name="material_id[]" required class="w-full px-2.5 py-1.5 border rounded-lg text-xs outline-none">
                                    <option value="">-- Chọn vật tư --</option>
                                    {% for m in materials %}
                                    <option value="{{ m.id }}">{{ m.code }} - {{ m.name }} (Còn tồn: {{ m.stock_quantity | number }} {{ m.unit }})</option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td class="py-2.5 px-3">
                                <input type="number" step="any" min="0.01" name="quantity[]" value="1" required class="w-full px-2 py-1.5 border rounded-lg text-xs text-center font-bold">
                            </td>
                            <td class="py-2.5 px-3 text-center">
                                <button type="button" onclick="removeRow(this)" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ghi chú xuất kho</label>
                <textarea name="note" rows="2" placeholder="Ghi chú người nhận, tổ mộc nhận phôi..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>
        </div>

        <div class="flex justify-end space-x-3">
            <a href="/inventory/issues" class="px-5 py-2.5 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
            <button type="submit" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-600/30">
                <i class="fa-solid fa-check mr-1.5"></i> Xác Nhận Xuất Kho
            </button>
        </div>
    </form>
</div>

<script>
    function addRow() {
        const tbody = document.getElementById('table-body');
        const firstRow = tbody.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelector('select').selectedIndex = 0;
        newRow.querySelector('input[name="quantity[]"]').value = 1;
        tbody.appendChild(newRow);
    }
    function removeRow(btn) {
        const rows = document.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.closest('.item-row').remove();
        } else {
            alert('Phiếu xuất phải có ít nhất 1 dòng vật tư!');
        }
    }
</script>
{% endblock %}
