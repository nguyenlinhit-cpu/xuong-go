{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
            <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
            <a href="/finance/cashbook" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Về sổ quỹ
            </a>
        </div>

        <form method="POST" action="/finance/receipt-voucher/new" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã phiếu thu *</label>
                    <input type="text" name="code" value="{{ code_default }}" required class="w-full px-3 py-2 border rounded-xl text-xs font-mono font-bold text-emerald-800 focus:ring-2 focus:ring-amber-500 outline-none uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ngày lập phiếu *</label>
                    <input type="date" name="transaction_date" value="{{ today_str }}" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Danh mục thu *</label>
                    <select name="category" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Hình thức thanh toán *</label>
                    <select name="payment_method" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                        {% for m in methods %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Người nộp tiền *</label>
                    <input type="text" name="payer" value="{{ selected_order.customer.name if selected_order else '' }}" required placeholder="Họ tên người nộp / khách hàng" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Số tiền thu (VNĐ) *</label>
                    <input type="number" step="any" min="1000" name="amount" value="{{ selected_order.remaining_amount if selected_order else '' }}" required placeholder="vd: 5000000" class="w-full px-3 py-2 border rounded-xl text-xs font-bold text-emerald-700 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Liên kết Đơn hàng bán (để tự trừ công nợ)</label>
                <select name="order_id" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    <option value="">-- Thu ngoài / Không gắn đơn hàng --</option>
                    {% for o in orders %}
                    <option value="{{ o.id }}" {% if selected_order and selected_order.id == o.id %}selected{% endif %}>
                        {{ o.code }} - {{ o.customer.name }} (Còn thiếu: {{ o.remaining_amount | currency }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Diễn giải / Ghi chú</label>
                <textarea name="note" rows="2" placeholder="Thu cọc đợt 2, thanh toán khi bàn giao công trình..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                <a href="/finance/cashbook" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                    <i class="fa-solid fa-check mr-1.5"></i> Lưu Phiếu Thu
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
