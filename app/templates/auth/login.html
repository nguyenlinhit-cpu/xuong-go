<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Xưởng Gỗ Phúc Thịnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Nền trang trí xưởng gỗ -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px]"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 z-10 transition-all">
        <!-- Header hộp thoại -->
        <div class="bg-gradient-to-r from-amber-700 via-amber-600 to-amber-500 p-8 text-white text-center relative">
            <div class="w-16 h-16 bg-white/20 backdrop-blur rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-inner">
                <i class="fa-solid fa-tree text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wide uppercase">XƯỞNG GỖ PHÚC THỊNH</h1>
            <p class="text-amber-100 text-sm mt-1">Hệ thống Điều hành Sản xuất & Quản lý Kho</p>
        </div>

        <div class="p-8">
            {% if flashes %}
            <div class="mb-5 space-y-2">
                {% for flash in flashes %}
                <div class="p-3.5 rounded-xl text-sm font-medium {% if flash.category == 'danger' %}bg-rose-50 text-rose-700 border border-rose-200{% elif flash.category == 'warning' %}bg-amber-50 text-amber-700 border border-amber-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
                    {{ flash.message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Tên đăng nhập</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" name="username" value="admin" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all font-medium"
                            placeholder="Nhập username...">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" name="password" value="admin123" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all font-medium"
                            placeholder="Nhập mật khẩu...">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-lg shadow-amber-600/30 transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center space-x-2">
                    <span>ĐĂNG NHẬP VÀO HỆ THỐNG</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Tài khoản mẫu để tiện test -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-xs text-slate-500">
                <p class="font-bold text-slate-700 mb-1 text-center">Tài khoản mẫu có sẵn:</p>
                <div class="grid grid-cols-2 gap-2 text-[11px] bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <div>👑 <b>admin</b> / admin123 (Toàn quyền)</div>
                    <div>🪵 <b>kho</b> / kho123 (Thủ kho)</div>
                    <div>🔨 <b>quandoc</b> / quandoc123 (Quản đốc)</div>
                    <div>💰 <b>ketoan</b> / ketoan123 (Kế toán)</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
