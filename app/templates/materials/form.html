{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden p-6">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
            <div>
                <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
                <p class="text-xs text-slate-500">Khai báo thông số kỹ thuật, quy cách và tồn kho tối thiểu</p>
            </div>
            <a href="/materials" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Quay lại danh sách
            </a>
        </div>

        <form method="POST" action="{% if material %}/materials/{{ material.id }}/edit{% else %}/materials/new{% endif %}" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã nguyên vật liệu *</label>
                    <input type="text" name="code" value="{{ material.code if material else '' }}" required {% if material %}readonly class="w-full px-3 py-2 bg-slate-100 border rounded-xl text-xs text-slate-500 font-mono"{% else %}placeholder="vd: NL-SO-02, PK-BL-02" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none uppercase font-mono"{% endif %}>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tên nguyên vật liệu *</label>
                    <input type="text" name="name" value="{{ material.name if material else '' }}" required placeholder="vd: Gỗ Sồi Trắng Bắc Mỹ xẻ sấy" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nhóm vật tư *</label>
                    <select name="category" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if material and material.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Loại gỗ (nếu là gỗ)</label>
                    <input type="text" name="wood_type" value="{{ material.wood_type if material and material.wood_type else '' }}" placeholder="vd: Sồi, Gõ đỏ, MDF..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Đơn vị tính *</label>
                    <input type="text" name="unit" value="{{ material.unit if material else 'm³' }}" required placeholder="m³, tấm, cái, bộ, lít..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Quy cách / Kích thước chi tiết</label>
                <input type="text" name="dimensions" value="{{ material.dimensions if material and material.dimensions else '' }}" placeholder="vd: 1220 x 2440 x 18 mm hoặc Dài 2.5m x Rộng 25cm" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {% if not material %}
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tồn kho ban đầu</label>
                    <input type="number" step="any" name="stock_quantity" value="0.0" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                {% endif %}
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Đơn giá vốn ước tính (VNĐ)</label>
                    <input type="number" step="any" name="unit_price" value="{{ material.unit_price if material else '0.0' }}" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mức tồn tối thiểu cảnh báo *</label>
                    <input type="number" step="any" name="min_stock_alert" value="{{ material.min_stock_alert if material else '5.0' }}" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mô tả / Ghi chú</label>
                <textarea name="description" rows="3" placeholder="Ghi chú về nguồn gốc, nhà cung cấp khuyên dùng, điều kiện bảo quản..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">{{ material.description if material and material.description else '' }}</textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                <a href="/materials" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md">
                    {{ "Lưu Thay Đổi" if material else "Tạo Nguyên Vật Liệu" }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
