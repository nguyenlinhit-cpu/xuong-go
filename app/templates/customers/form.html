{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
            <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
            <a href="/customers" class="text-xs text-slate-600 hover:text-slate-900 font-semibold flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Quay lại
            </a>
        </div>

        <form method="POST" action="/customers/new" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mã khách hàng *</label>
                    <input type="text" name="code" required placeholder="vd: KH-05" class="w-full px-3 py-2 border rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Họ tên khách hàng *</label>
                    <input type="text" name="name" required placeholder="vd: Anh Nguyễn Văn Nam" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Số điện thoại *</label>
                    <input type="text" name="phone" required placeholder="0988..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
                    <input type="email" name="email" placeholder="khachhang@gmail.com" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Địa chỉ giao hàng & thi công</label>
                <input type="text" name="address" placeholder="Số nhà, đường, quận/huyện, tỉnh..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ghi chú sở thích đồ gỗ</label>
                <textarea name="note" rows="3" placeholder="Khách thích gỗ tự nhiên màu lau, hay dùng ván An Cường..." class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                <a href="/customers" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md">Thêm Khách Hàng</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
